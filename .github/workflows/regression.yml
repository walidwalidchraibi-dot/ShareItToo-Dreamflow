name: regression

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  backend-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: sit_test
          POSTGRES_USER: sit_test
          POSTGRES_PASSWORD: sit_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sit_test -d sit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sit_test:sit_test_password@127.0.0.1:5432/sit_test
      TEST_DATABASE_URL: postgresql://sit_test:sit_test_password@127.0.0.1:5432/sit_test
      JWT_SECRET: ci-test-secret-that-is-longer-than-thirty-two-characters
      MAIL_TRANSPORT: memory
      UPLOAD_DIR: /tmp/shareittoo-test-uploads
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: backend/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install locked backend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backend tests and syntax checks
        run: |
          pnpm test
          pnpm run check

      - name: Validate production and staging Compose plans
        env:
          POSTGRES_PASSWORD: ci-only-postgres-password
          JWT_SECRET: ci-only-jwt-secret-that-is-longer-than-thirty-two-characters
          APP_COMMIT: ${{ github.sha }}
        run: |
          docker compose -f compose.prod.yml config --quiet
          docker compose -f compose.staging.yml config --quiet

      - name: Build commit-labelled API image
        env:
          APP_COMMIT: ${{ github.sha }}
        run: |
          APP_VERSION="0.1.0-${APP_COMMIT::12}"
          APP_BUILD_TIME="$(git show -s --format=%cI "$APP_COMMIT")"
          docker build \
            --build-arg "APP_VERSION=$APP_VERSION" \
            --build-arg "APP_COMMIT=$APP_COMMIT" \
            --build-arg "APP_BUILD_TIME=$APP_BUILD_TIME" \
            --tag "shareittoo-api:$APP_COMMIT" \
            .
          test "$(docker image inspect "shareittoo-api:$APP_COMMIT" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$APP_COMMIT"

  flutter-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run regression script
        run: bash scripts/technical_regression_check.sh

  publish-api-image:
    if: github.event_name == 'push'
    needs:
      - backend-regression
      - flutter-regression
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Build and publish the verified API image
        working-directory: backend
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_IMAGE: ghcr.io/walidwalidchraibi-dot/shareittoo-api
        run: |
          APP_VERSION="0.1.0-${GITHUB_SHA::12}"
          APP_BUILD_TIME="$(git show -s --format=%cI "$GITHUB_SHA")"
          IMAGE_REF="$REGISTRY_IMAGE:$GITHUB_SHA"

          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker build \
            --build-arg "APP_VERSION=$APP_VERSION" \
            --build-arg "APP_COMMIT=$GITHUB_SHA" \
            --build-arg "APP_BUILD_TIME=$APP_BUILD_TIME" \
            --tag "$IMAGE_REF" \
            .
          test "$(docker image inspect "$IMAGE_REF" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          docker push "$IMAGE_REF"
