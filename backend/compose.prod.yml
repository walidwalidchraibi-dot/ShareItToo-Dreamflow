services:
  postgres:
    image: postgres:16-alpine
    container_name: shareittoo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shareittoo
      POSTGRES_USER: shareittoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - shareittoo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shareittoo -d shareittoo"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend

  api:
    build:
      context: .
    container_name: shareittoo-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://shareittoo:${POSTGRES_PASSWORD}@postgres:5432/shareittoo
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: https://shareittoo.com,https://www.shareittoo.com,https://srv1580960.hstgr.cloud
      PUBLIC_BASE_URL: https://shareittoo.com/api/v1
      APP_PUBLIC_URL: https://shareittoo.com
      UPLOAD_DIR: /data/uploads
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-disabled}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: "${MAIL_FROM:-ShareItToo <contact@shareittoo.com>}"
      MAIL_REPLY_TO: "${MAIL_REPLY_TO:-contact@shareittoo.com}"
    volumes:
      - shareittoo_uploads:/data/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - backend

volumes:
  shareittoo_postgres_data:
    name: shareittoo_postgres_data
  shareittoo_uploads:
    name: shareittoo_uploads

networks:
  backend:
    name: shareittoo_backend
