    environment:
      BOOKING_PILOT_MODE: pilot
      PRIVATE_PILOT_V4_ENABLED: "true"
      PRIVATE_PILOT_ALLOWED_REGIONS: heilbronn
      BOOKING_GROUPS_ENABLED: "true"
      PLANNER_CORE_ENABLED: "true"
      PLANNER_INVENTORY_ENABLED: "true"
