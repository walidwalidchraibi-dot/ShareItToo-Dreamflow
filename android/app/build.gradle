plugins {
    id "com.android.application"
    id "kotlin-android"
    id "com.google.firebase.crashlytics"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}


def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def releaseRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('release')
}
def requiredSigningProperties = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
if (releaseRequested) {
    if (!keystorePropertiesFile.exists()) {
        throw new GradleException('Release signing is not configured: android/key.properties is missing.')
    }
    def missingSigningProperties = requiredSigningProperties.findAll {
        !keystoreProperties[it]?.trim()
    }
    if (!missingSigningProperties.isEmpty()) {
        throw new GradleException("Release signing is incomplete: missing ${missingSigningProperties.join(', ')} in android/key.properties.")
    }
    if (!file(keystoreProperties['storeFile']).exists()) {
        throw new GradleException('Release signing is invalid: the configured upload keystore does not exist.')
    }
}

android {
    namespace = "com.shareittoo.app"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    defaultConfig {
        applicationId = "com.shareittoo.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.getByName("release")
        }
    }
}

flutter {
    source = "../.."
}
